<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NFC Sunday School 수업 도구</title>
<style>
:root{
  --bg:#F9F9F6; --ink:#2C3E50; --line:#2C3E50; --soft:#E9E9E2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{ --bg:#F9F9F6; --ink:#2C3E50; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  line-height:1.6; -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 40px}
header{padding-bottom:16px;border-bottom:3px solid var(--ink)}
h1{margin:0;font-size:2rem;font-weight:800;letter-spacing:-0.01em}
#today{margin:6px 0 0;font-size:1.5rem;font-weight:600}
nav{margin:20px 0}
[role="tablist"]{display:flex;flex-wrap:wrap;gap:10px}
[role="tab"]{
  min-height:68px;min-width:68px;padding:0 26px;
  font:inherit;font-size:1.6rem;font-weight:800;color:var(--ink);
  background:var(--bg);border:2px solid var(--line);border-radius:12px;cursor:pointer;
}
[role="tab"][aria-selected="true"]{background:var(--ink);color:var(--bg)}
[role="tab"]:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
[role="tabpanel"]{
  min-height:260px;padding:32px 24px;border:2px solid var(--line);border-radius:12px;
  background:var(--soft);
}
[role="tabpanel"][hidden]{display:none}
.panel-title{margin:0 0 12px;font-size:1.5rem}
.panel-note{margin:0;font-size:1.25rem}
[role="tabpanel"].lesson{padding:0;border:0;background:transparent;min-height:0}
.scene-card{border:2px solid var(--ink);border-radius:28px;overflow:hidden;background:#FFF8E7}
.scene-card svg{display:block;width:100%;height:auto}
.scene-cap{margin:0;padding:18px 24px;text-align:center;font-size:1.9rem;font-weight:800;line-height:1.5;word-break:keep-all;background:#FFF8E7}
@media (max-width:600px){.scene-cap{font-size:1.4rem;padding:14px 16px}}
.scene-card svg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag{cursor:grab;touch-action:none}
.drag.dragging{cursor:grabbing;filter:drop-shadow(0 8px 6px rgba(44,62,80,.35))}
.drag.returning{transition:transform .4s ease}
@media (prefers-reduced-motion:reduce){.drag.returning{transition:none}}
.scene-actions{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin-top:20px}
.fall-btn{min-height:68px;min-width:200px;padding:0 36px;font:inherit;font-size:1.6rem;font-weight:800;color:var(--ink);background:#FFE5D0;border:2px solid var(--line);border-radius:12px;cursor:pointer}
.fall-btn:active{background:var(--ink);color:var(--bg)}
.fall-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.fall-btn:disabled{opacity:.4;cursor:default}
.drag[data-name="골리앗"]{transform-origin:558px 432px}
.drag.falling{transition:transform .95s cubic-bezier(.5,0,.85,.55)}
.drag .tag{transition:opacity .3s}
.is-fallen .drag[data-name="골리앗"] .tag{opacity:0}
.flystone{pointer-events:none}
.thud{font-size:64px;font-weight:900;fill:#E4745A;stroke:#fff;stroke-width:10px;paint-order:stroke;stroke-linejoin:round;pointer-events:none;text-anchor:middle;transform-box:fill-box;transform-origin:center;animation:thud 1.2s ease-out forwards}
@keyframes thud{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.25)}100%{opacity:0;transform:scale(1) translateY(-24px)}}
@media (prefers-reduced-motion:reduce){.drag.falling{transition:none}}
.reset-btn{min-height:68px;min-width:200px;padding:0 36px;font:inherit;font-size:1.6rem;font-weight:800;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;cursor:pointer}
.reset-btn:active{background:var(--ink);color:var(--bg)}
.reset-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.think{margin-top:28px;border:2px solid var(--line);border-radius:16px;background:var(--soft)}
.think summary{min-height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:1.7rem;font-weight:800;cursor:pointer;list-style:none}
.think summary::-webkit-details-marker{display:none}
.think summary::after{content:"펼치기";font-size:1.15rem;font-weight:700}
.think[open] summary::after{content:"접기"}
.think summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:14px}
.c1{--cc:#FFD6E3}.c2{--cc:#FFF2BF}.c3{--cc:#CFE8FA}.c4{--cc:#D5EFCB}
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:8px 20px 20px}
.q-card{display:flex;flex-direction:column;align-items:flex-start;gap:12px;min-height:180px;padding:22px 24px;text-align:left;font:inherit;color:var(--ink);background:var(--cc);border:3px solid var(--ink);border-radius:24px;cursor:pointer;word-break:keep-all;box-shadow:0 6px 0 rgba(44,62,80,.2)}
.q-card:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(44,62,80,.2)}
.q-card:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.q-num{display:inline-block;padding:4px 16px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:1.15rem;font-weight:800}
.q-text{font-size:1.55rem;font-weight:800;line-height:1.5}
.q-full{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:calc(24px + env(safe-area-inset-top,0px)) 32px calc(24px + env(safe-area-inset-bottom,0px));background:var(--cc);color:var(--ink);text-align:center;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.q-full[hidden]{display:none}
.qf-count{margin:0;padding:6px 26px;border-radius:999px;background:var(--ink);color:var(--bg);font-size:1.5rem;font-weight:800}
.qf-text{margin:0;max-width:1000px;font-size:clamp(2rem,5vw,3.8rem);font-weight:900;line-height:1.45;word-break:keep-all}
.qf-nav{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.qf-btn{min-height:72px;min-width:150px;padding:0 32px;font:inherit;font-size:1.6rem;font-weight:800;color:var(--ink);background:rgba(255,255,255,.8);border:3px solid var(--ink);border-radius:16px;cursor:pointer}
.qf-btn:active{background:var(--ink);color:var(--bg)}
.qf-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:600px){.q-grid{grid-template-columns:1fr;padding:8px 14px 16px}.q-card{min-height:0}.q-text{font-size:1.35rem}}
.cover{
  text-align:center;padding:52px 28px 44px;border-radius:28px;border:2px solid var(--ink);
  background:linear-gradient(135deg,#FFE5D0 0%,#FFF2BF 48%,#FFD6E3 100%);
  word-break:keep-all;
}
.cover h2{margin:0;font-size:3.8rem;font-weight:900;line-height:1.2}
.cover .sub{margin:12px 0 0;font-size:2.1rem;font-weight:700}
.ask{
  max-width:840px;margin:36px auto 0;padding:24px 32px;border-radius:24px;
  background:rgba(255,255,255,.72);font-size:2.6rem;font-weight:800;line-height:1.45;
}
.verse{
  max-width:840px;margin:28px auto 0;padding:34px 36px;border-radius:28px;
  background:var(--ink);color:var(--bg);
  border:6px solid #F6C453;box-shadow:0 10px 0 rgba(44,62,80,.2);
}
.verse .ref{
  display:inline-block;margin:0 0 18px;padding:6px 22px;border-radius:999px;
  background:#F6C453;color:var(--ink);font-size:1.6rem;font-weight:900;
}
.verse .text{margin:0;font-size:2.1rem;font-weight:700;line-height:1.6}
.flow{margin-top:20px;border:2px solid var(--line);border-radius:16px;background:var(--soft)}
.flow summary{
  min-height:64px;display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;font-size:1.3rem;font-weight:800;cursor:pointer;list-style:none;
}
.flow summary::-webkit-details-marker{display:none}
.flow summary::after{content:"펼치기";font-size:1.15rem;font-weight:700}
.flow[open] summary::after{content:"접기"}
.flow summary:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:14px}
.steps{list-style:none;margin:0;padding:0 24px 12px}
.steps li{padding:6px 0;border-top:1px solid rgba(44,62,80,.25)}
.steps .row{
  display:flex;align-items:center;gap:16px;width:100%;min-height:60px;padding:0 14px;
  font:inherit;font-size:1.3rem;color:var(--ink);text-align:left;
  background:transparent;border:0;border-radius:12px;cursor:pointer;
}
.steps .row:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.steps .row[aria-current="step"]{background:var(--ink);color:var(--bg)}
.steps .st{min-width:3em;font-weight:800}
.steps .now{display:none;padding:2px 12px;border-radius:999px;background:#F6C453;color:var(--ink);font-size:1.05rem;font-weight:900}
.steps .row[aria-current="step"] .now{display:inline-block}
.steps .tm{margin-left:auto;font-weight:800;white-space:nowrap}
@media (max-width:600px){
  .cover{padding:36px 18px 32px}
  .cover h2{font-size:2.5rem}
  .cover .sub{font-size:1.6rem}
  .ask{font-size:1.9rem;padding:18px 20px}
  .verse{padding:24px 20px}
  .verse .text{font-size:1.5rem}
  h1{font-size:1.6rem}
  [role="tab"]{flex:1 1 40%;padding:0 12px}
}
/* ===== 퀴즈 / 짝 맞추기 / 찬양 ===== */
.qz [hidden],.mt [hidden]{display:none!important}
.fx-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1100}
.qz{max-width:760px;margin:0 auto}
.qz-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.qz-prog{font-size:1.7rem;font-weight:800}
.qz-score{min-width:120px;padding:6px 20px;border:3px solid var(--ink);border-radius:999px;background:#FFF2BF;font-size:1.8rem;font-weight:900;text-align:center;white-space:nowrap}
.qz-score.pop b{display:inline-block;animation:qzpop .55s ease}
@keyframes qzpop{0%{transform:scale(1)}40%{transform:scale(1.9) rotate(-8deg)}100%{transform:scale(1)}}
.qz-bar{height:14px;margin:12px 0 18px;border:2px solid var(--ink);border-radius:99px;background:var(--soft);overflow:hidden}
.qz-bar i{display:block;height:100%;width:0;background:#F6C453;transition:width .4s}
.qz-card{padding:24px 20px;border:2px solid var(--ink);border-radius:24px;background:#FFF8E7}
.qz-q{margin:0 0 18px;font-size:2rem;font-weight:900;line-height:1.4;word-break:keep-all}
.qz-opts{display:grid;gap:14px}
.qz-opt{display:flex;align-items:center;gap:14px;min-height:80px;padding:12px 18px;font:inherit;font-size:1.7rem;font-weight:800;text-align:left;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:20px;cursor:pointer;word-break:keep-all;transition:opacity .3s}
.qz-opt:active:not(:disabled){transform:scale(.97)}
.qz-opt:focus-visible,.qz-btn:focus-visible,.mt-b:focus-visible,.mt-cd:focus-visible,.pr-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.qz-opt b{flex:none;width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:var(--ink);color:var(--bg);font-size:1.5rem}
.qz-opt .mk{margin-left:auto;font-size:2rem;font-style:normal}
.qz-opt.ok{background:#D5EFCB;border-color:#2E8B57}
.qz-opt.bad{background:#FFD6E3;border-color:#D94F5C;animation:qzshake .4s}
.qz-opt.dim{opacity:.35}
.qz-opt:disabled{cursor:default}
@keyframes qzshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qz-exp{display:none;margin-top:18px;padding:16px 18px;border-radius:20px;font-size:1.5rem;word-break:keep-all}
.qz-exp.show{display:block;animation:qzup .35s ease}
.qz-exp.ok{background:#D5EFCB;border:3px solid #2E8B57}
.qz-exp.bad{background:#FFD6E3;border:3px solid #D94F5C}
.qz-exp h3{margin:0 0 6px;font-size:1.8rem}
.qz-exp small{display:block;margin-top:8px;font-size:1.25rem;font-weight:700}
@keyframes qzup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.qz-btn{display:block;width:100%;min-height:72px;margin-top:16px;font:inherit;font-size:1.7rem;font-weight:800;color:var(--bg);background:var(--ink);border:3px solid var(--ink);border-radius:16px;cursor:pointer}
.qz-btn.ghost{color:var(--ink);background:transparent}
.qz-btn:active{transform:scale(.97)}
.qz-res{text-align:center}
.qz-big{font-size:110px;line-height:1.1;animation:qzpop .8s ease}
.qz-res h2{margin:6px 0;font-size:2.2rem;word-break:keep-all}
.qz-pts{font-size:1.9rem;font-weight:900}
.qz-line{margin:14px 0;font-size:2.4rem;letter-spacing:10px}
.mt{padding:0 4px}
.mt-bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.mt-seg,.mt-stats{display:flex;flex-wrap:wrap;gap:10px}
.mt-b{min-height:64px;padding:0 24px;font:inherit;font-size:1.6rem;font-weight:800;color:var(--ink);background:var(--bg);border:3px solid var(--ink);border-radius:14px;cursor:pointer}
.mt-b[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.mt-stat{padding:6px 20px;border:3px solid var(--ink);border-radius:999px;background:#FFF2BF;font-size:1.7rem;font-weight:900;white-space:nowrap}
.mt-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative;left:50%;transform:translateX(-50%);width:min(calc(100vw - 48px),max(300px,calc((100vh - 430px) * 4.7 / var(--rows,2))));width:min(calc(100vw - 48px),max(300px,calc((100dvh - 430px) * 4.7 / var(--rows,2))))}
.mt-cd{aspect-ratio:1.2;perspective:900px;container-type:inline-size;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit;display:block}
.mt-in{position:relative;display:block;width:100%;height:100%;transition:transform .55s;transform-style:preserve-3d}
.mt-cd.up .mt-in{transform:rotateY(180deg)}
.mt-fc{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:7cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mt-fc.num{background:var(--ink);color:var(--bg);font-size:46cqw;font-weight:900}
.mt-fc.pic{background:#fff;transform:rotateY(180deg);font-size:42cqw;line-height:1.05}
.mt-fc.pic small{font-size:17cqw;font-weight:900;line-height:1.25}
.mt-cd.done .mt-fc.pic{background:#D5EFCB;border-color:#2E8B57}
.mt-cd.done{animation:mthop .5s .5s}
@keyframes mthop{40%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.mt-in{transition:none}.mt-cd.done{animation:none}}
.mt-cele{position:fixed;top:0;right:0;bottom:0;left:0;z-index:900;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(44,62,80,.6)}
.mt-box{width:100%;max-width:900px;padding:28px 24px;text-align:center;background:#FFF8E7;border:6px solid #F6C453;border-radius:36px}
.mt-tro{font-size:min(30vw,240px);line-height:1.05;animation:qzpop .9s ease,mtbob 1.2s .9s infinite ease-in-out}
.mt-txt{margin:8px 0;font-size:clamp(2.2rem,6vw,4.6rem);font-weight:900;line-height:1.3;word-break:keep-all}
.mt-sub{font-size:clamp(2rem,5vw,3.4rem);letter-spacing:8px;animation:mtbob 1s infinite ease-in-out}
@keyframes mtbob{50%{transform:translateY(-14px)}}
.mt-acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px}
.mt-acts .qz-btn{flex:1;min-width:200px}
.pr-songs{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:860px){.pr-songs{grid-template-columns:1fr 1fr}}
.pr-song{display:flex;flex-direction:column;gap:16px;padding:22px 20px;background:#FFF8E7;border:3px solid var(--ink);border-radius:24px}
.pr-song h2{margin:0;font-size:clamp(2.2rem,4vw,3rem);font-weight:900;line-height:1.25;word-break:keep-all}
.pr-verse{margin:0;font-size:1.35rem;font-weight:700;word-break:keep-all}
.pr-vid{aspect-ratio:16/9;display:grid;place-items:center;padding:12px;text-align:center;font-size:1.5rem;font-weight:700;background:var(--soft);border:3px dashed var(--ink);border-radius:20px;overflow:hidden}
.pr-vid.has{padding:0;border:0;background:#000}
.pr-vid iframe{display:block;width:100%;height:100%;border:0}
.pr-btn{display:flex;align-items:center;justify-content:center;min-height:84px;font-size:1.8rem;font-weight:900;color:var(--bg);background:var(--ink);border-radius:20px;text-decoration:none}
.pr-btn:active{transform:scale(.97)}
.pr-btn.off{opacity:.4;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NFC Sunday School</h1>
    <p id="today"></p>
  </header>

  <nav aria-label="수업 도구 메뉴">
    <div role="tablist" id="tabs"></div>
  </nav>
  <main id="panels"></main>

<template id="story-tpl">
<div class="scene-card">
<svg viewBox="0 0 800 490" role="img" aria-label="엘라 골짜기에서 작은 소년 다윗과 아주 큰 거인 골리앗이 마주 선 그림">
<defs>
  <linearGradient id="skyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BFE3F5"/><stop offset="1" stop-color="#FFF1D2"/></linearGradient>
  <radialGradient id="sunG"><stop offset="0" stop-color="#FFE9A3"/><stop offset="1" stop-color="#FFE9A3" stop-opacity="0"/></radialGradient>
  <g id="cloud">
    <ellipse cx="0" cy="20" rx="58" ry="18" fill="#fff" opacity=".92"/>
    <ellipse cx="-24" cy="8" rx="26" ry="18" fill="#fff" opacity=".92"/>
    <ellipse cx="18" cy="2" rx="30" ry="22" fill="#fff" opacity=".92"/>
  </g>
  <g id="sheep">
    <ellipse cx="6" cy="8" rx="34" ry="6" fill="#000" opacity=".08"/>
    <rect x="-12" y="-4" width="5" height="13" rx="2" fill="#6E5A52"/>
    <rect x="18" y="-4" width="5" height="13" rx="2" fill="#6E5A52"/>
    <circle cx="-14" cy="-18" r="14" fill="#FFFBF2"/>
    <circle cx="6" cy="-25" r="16" fill="#FFFBF2"/>
    <circle cx="24" cy="-16" r="13" fill="#FFFBF2"/>
    <ellipse cx="6" cy="-12" rx="30" ry="16" fill="#FFFBF2"/>
    <ellipse cx="43" cy="-14" rx="11" ry="12" fill="#6E5A52"/>
    <ellipse cx="35" cy="-23" rx="6" ry="3.5" fill="#6E5A52" transform="rotate(-20 35 -23)"/>
    <circle cx="46" cy="-17" r="2" fill="#fff"/>
  </g>
  <g id="tuft" fill="none" stroke="#7FB866" stroke-width="3" stroke-linecap="round">
    <path d="M0 0 L-5 -11"/><path d="M0 0 L0 -14"/><path d="M0 0 L5 -11"/>
  </g>
  <g id="flower">
    <circle cx="-5" cy="0" r="4.5" fill="#FFB6C9"/><circle cx="5" cy="0" r="4.5" fill="#FFB6C9"/>
    <circle cx="0" cy="-5" r="4.5" fill="#FFB6C9"/><circle cx="0" cy="5" r="4.5" fill="#FFB6C9"/>
    <circle cx="0" cy="0" r="3" fill="#FFE08A"/>
  </g>
</defs>

<!-- 하늘 -->
<rect width="800" height="260" fill="url(#skyG)"/>
<circle cx="90" cy="72" r="72" fill="url(#sunG)"/>
<circle cx="90" cy="72" r="32" fill="#FFE08A"/>
<use href="#cloud" x="270" y="36"/>
<use href="#cloud" transform="translate(470,96) scale(.8)"/>
<use href="#cloud" transform="translate(730,40) scale(.7)"/>

<!-- 언덕 -->
<path d="M0 250 Q120 170 260 225 T520 215 T800 200 L800 400 L0 400 Z" fill="#CFE6B0"/>
<path d="M0 300 Q160 240 330 290 T620 280 T800 270 L800 420 L0 420 Z" fill="#B5D98F"/>

<!-- 장막 -->
<g class="drag" data-name="장막">
  <path d="M105 294 L160 222 L215 294 Z" fill="#F3D7A0"/>
  <path d="M160 222 L132 294 L105 294 Z" fill="#EBC688"/>
  <path d="M160 222 L188 294 L215 294 Z" fill="#F8E4B8"/>
  <path d="M148 294 L160 258 L172 294 Z" fill="#8A6A4A"/>
  <line x1="160" y1="222" x2="160" y2="206" stroke="#A47A52" stroke-width="4" stroke-linecap="round"/>
  <path d="M160 206 L178 211 L160 217 Z" fill="#F29BB0"/>

<script>
(function(){
  var names=["찬양","공과","성경 이야기","퀴즈","짝 맞추기","출석","달란트","반 관리"];

  var panels=document.getElementById("panels");

  var d=new Date();
  var days=["일","월","화","수","목","금","토"];
  document.getElementById("today").textContent=
    "오늘은 "+d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+days[d.getDay()]+"요일";

  names.forEach(function(n,i){

    b.tabIndex=n==="공과"?0:-1;
    b.addEventListener("click",function(){select(i)});
    b.addEventListener("keydown",function(e){
      if(e.key==="ArrowRight")select((i+1)%names.length,true);
      if(e.key==="ArrowLeft")select((i+names.length-1)%names.length,true);
    });
    tabs.appendChild(b);

    var p=document.createElement("section");
    p.id="panel-"+i;p.setAttribute("role","tabpanel");
    p.setAttribute("aria-labelledby","tab-"+i);
    if(n!=="공과")p.hidden=true;
    if(n==="공과"){
      p.classList.add("lesson");
      p.innerHTML=
        '<div class="cover">'+
          '<h2>다윗과 골리앗</h2>'+
          '<p class="sub">하나님이 함께하시면</p>'+
          '<p class="ask">키가 크고 힘이 센 사람이 이기는 걸까요?</p>'+
          '<div class="verse">'+
            '<p class="ref">사무엘상 17장 45절</p>'+
            '<p class="text">다윗이 블레셋 사람에게 이르되 너는 칼과 창과 단창으로 내게 나아 오거니와 나는 만군의 여호와의 이름 곧 네가 모욕하는 이스라엘 군대의 하나님의 이름으로 네게 나아가노라</p>'+
          '</div>'+
        '</div>'+
        '<details class="flow">'+
          '<summary>수업 흐름 (총 40분)</summary>'+
          '<ol class="steps">'+
            '<li><button type="button" class="row"><span class="st">도입</span><span>마음 열기</span><span class="now">지금</span><span class="tm">5분</span></button></li>'+
            '<li><button type="button" class="row"><span class="st">말씀</span><span>성경 이야기</span><span class="now">지금</span><span class="tm">12분</span></button></li>'+
            '<li><button type="button" class="row"><span class="st">활동</span><span>짝 맞추기와 퀴즈</span><span class="now">지금</span><span class="tm">10분</span></button></li>'+
            '<li><button type="button" class="row"><span class="st">적용</span><span>나의 골리앗</span><span class="now">지금</span><span class="tm">8분</span></button></li>'+
            '<li><button type="button" class="row"><span class="st">기도</span><span>함께</span><span class="now">지금</span><span class="tm">5분</span></button></li>'+
          '</ol>'+
        '</details>';
      var rows=p.querySelectorAll(".row");
      rows.forEach(function(r){
        r.addEventListener("click",function(){
          var on=r.getAttribute("aria-current")==="step";
          rows.forEach(function(x){x.removeAttribute("aria-current")});
          if(!on)r.setAttribute("aria-current","step");
        });
      });
    }else if(n==="성경 이야기"){
      p.classList.add("lesson");
      p.innerHTML=document.getElementById("story-tpl").innerHTML;
      initStory(p);
      initThink(p);
    }else if(n==="퀴즈"){
      p.classList.add("lesson");initQuiz(p);
    }else if(n==="짝 맞추기"){
      p.classList.add("lesson");initMatch(p);
    }else if(n==="찬양"){
      initPraise(p);
    }else{
      p.innerHTML='<h2 class="panel-title"></h2><p class="panel-note">다음 주에 만듭니다</p>';
      p.querySelector("h2").textContent=n;
    }
    panels.appendChild(p);
  });

  function initStory(panel){
    var svg=panel.querySelector("svg");
    var NS="http://www.w3.org/2000/svg";
    var VW=800,VH=490;
    var layer=document.createElementNS(NS,"g");
    svg.appendChild(layer);

    Array.prototype.forEach.call(svg.querySelectorAll(".tag"),function(t){
      var f=svg.querySelector('.drag[data-name="'+t.getAttribute("data-for")+'"]');
      if(f)f.appendChild(t);
    });

    var items=Array.prototype.slice.call(svg.querySelectorAll(".drag"));
    items.forEach(function(g){g._x=0;g._y=0;layer.appendChild(g);});

    var cur=null;
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function toSvg(e){
      var m=svg.getScreenCTM();
      if(!m)return null;
      var pt=svg.createSVGPoint();
      pt.x=e.clientX;pt.y=e.clientY;
      return pt.matrixTransform(m.inverse());
    }
    function setPos(g,x,y,r){
      g._x=x;g._y=y;
      if(r!==undefined)g._r=r;
      g.style.transform="translate("+x+"px,"+y+"px) rotate("+(g._r||0)+"deg)";
    }

    svg.addEventListener("pointerdown",function(e){
      if(cur)return;
      if(e.pointerType==="mouse"&&e.button!==0)return;
      var g=e.target.closest&&e.target.closest(".drag");
      if(!g)return;
      var p=toSvg(e);
      if(!p)return;
      var b=boxOf(g);
      cur={g:g,id:e.pointerId,sx:p.x,sy:p.y,cx:e.clientX,cy:e.clientY,x0:g._x,y0:g._y,
        minx:-b.x,maxx:VW-(b.x+b.width),miny:-b.y,maxy:VH-(b.y+b.height)};
      g.classList.remove("returning","falling");
      layer.appendChild(g);
      g.classList.add("dragging");
      try{svg.setPointerCapture(e.pointerId);}catch(_){}
      e.preventDefault();
    });

    svg.addEventListener("pointermove",function(e){
      if(!cur||e.pointerId!==cur.id)return;
      var p=toSvg(e);
      if(!p)return;
      setPos(cur.g,
        clamp(cur.x0+p.x-cur.sx,cur.minx,cur.maxx),
        clamp(cur.y0+p.y-cur.sy,cur.miny,cur.maxy));
      e.preventDefault();
    });

    function end(e){
      if(!cur||e.pointerId!==cur.id)return;
      cur.g.classList.remove("dragging");
      try{svg.releasePointerCapture(e.pointerId);}catch(_){}
      cur=null;
    }
    svg.addEventListener("pointerup",function(e){
      var c=cur;
      end(e);
      if(!c||e.pointerId!==c.id||c.g!==gol)return;
      if(Math.abs(e.clientX-c.cx)>10||Math.abs(e.clientY-c.cy)>10){lastTap=0;return;}
      var now=Date.now();
      if(now-lastTap<450){lastTap=0;fall();}
      else lastTap=now;
    });
    svg.addEventListener("pointercancel",end);
    svg.addEventListener("lostpointercapture",end);

    var gol=svg.querySelector('.drag[data-name="골리앗"]');
    var dav=svg.querySelector('.drag[data-name="다윗"]');
    var fallBtn=panel.querySelector(".fall-btn");
    var fallen=false,token=0,lastTap=0;

    function boxOf(g){
      var b=g.getBBox();
      if(g._r===-90){
        return {x:558+(b.y-432),y:432-(b.x+b.width-558),width:b.height,height:b.width};
      }
      return b;
    }
    function fall(){
      if(cur||fallen)return;
      fallen=true;
      fallBtn.disabled=true;
      var t=++token;
      svg.classList.add("fired");
      var s0={x:281+dav._x,y:333+dav._y};
      var s1={x:590+gol._x,y:112+gol._y};
      var stone=document.createElementNS(NS,"circle");
      stone.setAttribute("class","flystone");
      stone.setAttribute("r","7");
      stone.setAttribute("fill","#B7B2A6");
      stone.setAttribute("stroke","#9A9488");
      stone.setAttribute("stroke-width","2");
      svg.appendChild(stone);
      var t0=null;
      function step(ts){
        if(t!==token){stone.remove();return;}
        if(t0===null)t0=ts;
        var k=Math.min(1,(ts-t0)/650);
        stone.setAttribute("cx",s0.x+(s1.x-s0.x)*k);
        stone.setAttribute("cy",s0.y+(s1.y-s0.y)*k-Math.sin(Math.PI*k)*70);
        if(k<1)requestAnimationFrame(step);
        else{stone.remove();topple(t);}
      }
      requestAnimationFrame(step);
    }
    function topple(t){
      if(t!==token)return;
      gol._r=-90;
      var b=boxOf(gol);
      var tx=clamp(gol._x+90,-b.x,VW-(b.x+b.width));
      var ty=clamp(gol._y,-b.y,VH-(b.y+b.height));
      gol.classList.remove("returning");
      gol.classList.add("falling");
      svg.classList.add("is-fallen");
      setPos(gol,tx,ty,-90);
      setTimeout(function(){
        if(t!==token)return;
        gol.classList.remove("falling");
        var th=document.createElementNS(NS,"text");
        th.setAttribute("class","thud");
        th.setAttribute("x",String(258+tx));
        th.setAttribute("y",String(330+ty));
        th.textContent="쿵!";
        svg.appendChild(th);
        setTimeout(function(){th.remove();},1300);
      },950);
    }
    function resetFall(){
      token++;
      fallen=false;
      fallBtn.disabled=false;
      gol.classList.remove("falling");
      svg.classList.remove("fired","is-fallen");
      Array.prototype.forEach.call(svg.querySelectorAll(".thud,.flystone"),function(n){n.remove();});
    }
    fallBtn.addEventListener("click",fall);

    svg.addEventListener("touchmove",function(e){
      if(cur&&e.cancelable)e.preventDefault();
    },{passive:false});

    panel.querySelector(".reset-btn").addEventListener("click",function(){
      if(cur)return;
      resetFall();
      items.forEach(function(g){layer.appendChild(g);});
      void svg.getBoundingClientRect();
      items.forEach(function(g){
        g.classList.add("returning");
        setPos(g,0,0,0);
      });
      setTimeout(function(){
        items.forEach(function(g){g.classList.remove("returning");});
      },450);
    });
  }

  function initThink(panel){
    var cards=Array.prototype.slice.call(panel.querySelectorAll(".q-card"));
    var ov=panel.querySelector(".q-full");
    var cnt=ov.querySelector(".qf-count");
    var txt=ov.querySelector(".qf-text");
    var prev=ov.querySelector(".qf-prev");
    var next=ov.querySelector(".qf-next");
    var close=ov.querySelector(".qf-close");
    var n=cards.length,idx=0,opener=null,sx=null;

    function show(i){
      idx=(i+n)%n;
      ov.className="q-full c"+(idx+1);
      cnt.textContent="질문 "+(idx+1)+" / "+n;
      txt.textContent=cards[idx].querySelector(".q-text").textContent;
    }
    function onKey(e){
      if(e.key==="Escape"){e.preventDefault();shut();}
      else if(e.key==="ArrowRight"){show(idx+1);}
      else if(e.key==="ArrowLeft"){show(idx-1);}
      else if(e.key==="Tab"){
        var f=[prev,close,next],k=f.indexOf(document.activeElement);
        if(e.shiftKey){if(k<=0){e.preventDefault();f[f.length-1].focus();}}
        else if(k<0||k===f.length-1){e.preventDefault();f[0].focus();}
      }
    }
    function open(i){
      opener=cards[i];
      show(i);
      ov.hidden=false;
      document.body.style.overflow="hidden";
      document.addEventListener("keydown",onKey);
      close.focus();
    }
    function shut(){
      ov.hidden=true;
      document.body.style.overflow="";
      document.removeEventListener("keydown",onKey);
      if(opener)opener.focus();
    }

    cards.forEach(function(c,i){c.addEventListener("click",function(){open(i);});});
    prev.addEventListener("click",function(){show(idx-1);});
    next.addEventListener("click",function(){show(idx+1);});
    close.addEventListener("click",shut);

    ov.addEventListener("pointerdown",function(e){
      if(e.target.closest("button"))return;
      sx=e.clientX;
    });
    ov.addEventListener("pointerup",function(e){
      if(sx===null)return;
      var dx=e.clientX-sx;
      sx=null;
      if(Math.abs(dx)>60)show(idx+(dx<0?1:-1));
    });
    ov.addEventListener("pointercancel",function(){sx=null;});
  }

  /* ===== 퀴즈 · 짝 맞추기 · 찬양 ===== */
  var cfCv=null,cfCx=null,cfP=[],cfRun=false;
  var CF_COL=["#ff5964","#ffd23f","#3bceac","#4d9de0","#a45ee5","#ff9f1c"];
  function confetti(n,y,s){
    if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
    if(!cfCv){
      cfCv=document.createElement("canvas");cfCv.className="fx-canvas";cfCv.setAttribute("aria-hidden","true");
      document.body.appendChild(cfCv);cfCx=cfCv.getContext("2d");
      var fit=function(){cfCv.width=window.innerWidth;cfCv.height=window.innerHeight;};
      fit();window.addEventListener("resize",fit);
    }
    for(var k=0;k<n;k++){
      cfP.push({x:cfCv.width*(0.15+Math.random()*0.7),y:cfCv.height*y,vx:(Math.random()-.5)*12,vy:-Math.random()*13-3,
        w:(6+Math.random()*8)*(s||1),h:(10+Math.random()*10)*(s||1),r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:CF_COL[Math.floor(Math.random()*CF_COL.length)],life:110+Math.random()*60});
    }
    if(!cfRun){cfRun=true;requestAnimationFrame(cfTick);}
  }
  function cfTick(){
    cfCx.clearRect(0,0,cfCv.width,cfCv.height);
    cfP=cfP.filter(function(q){return q.life>0&&q.y<cfCv.height+30;});
    cfP.forEach(function(q){
      q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.r+=q.vr;q.life--;
      cfCx.save();cfCx.translate(q.x,q.y);cfCx.rotate(q.r);
      cfCx.globalAlpha=Math.min(1,q.life/30);cfCx.fillStyle=q.c;
      cfCx.fillRect(-q.w/2,-q.h/2,q.w,q.h);cfCx.restore();
    });
    if(cfP.length)requestAnimationFrame(cfTick);
    else{cfRun=false;cfCx.clearRect(0,0,cfCv.width,cfCv.height);}
  }
  function shuf(a){
    for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t;}
    return a;
  }

    var q=function(s){return p.querySelector(s);};
    var prog=q(".qz-prog"),fill=q(".qz-bar i"),main=q(".qz-main"),resBox=q(".qz-res"),

    var i=0,score=0,res=[],done=false;

    function show(){

    function result(){

      else if(score===3){m="🥈";t="은메달! 멋져요!";}
      else if(score===2){m="🥉";t="동메달! 조금만 더 힘내요!";}
      else{m="🌱";t="괜찮아요! 다시 도전해 봐요!";}
      resBox.querySelector(".qz-big").textContent=m;
      resBox.querySelector("h2").textContent=t;

      resBox.querySelector(".qz-line").textContent=res.map(function(r){return r?"⭐":"·";}).join(" ");
      if(score>=3){confetti(220,0.3);setTimeout(function(){confetti(160,0.4);},600);
        if(score>=4)setTimeout(function(){confetti(160,0.25);},1200);}

    next.addEventListener("click",function(){

    });

    });
    show();
  }

  function ytId(u){
    try{
      var x=new URL(u),h=x.hostname.toLowerCase(),id="";
      if(h.indexOf("www.")===0||h.indexOf("m.")===0)h=h.slice(h.indexOf(".")+1);
      if(h==="youtu.be")id=x.pathname.split("/")[1]||"";
      else if(h==="youtube.com"){
        var s=x.pathname.split("/");
        id=x.searchParams.get("v")||((s[1]==="embed"||s[1]==="shorts"||s[1]==="live")?s[2]:"")||"";
      }
      return /^[A-Za-z0-9_-]{11}$/.test(id)?id:"";
    }catch(e){return "";}
  }
