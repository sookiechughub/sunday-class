/* ===== 퀴즈 / 짝 맞추기 / 찬양 ===== */
.qz [hidden],.mt [hidden]{display:none!important}
.fx-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1100}

.qz-bar{height:14px;margin:12px 0 18px;border:2px solid var(--ink);border-radius:99px;background:var(--soft);overflow:hidden}

.qz-opt:active:not(:disabled){transform:scale(.97)}
.qz-opt:focus-visible,.qz-btn:focus-visible,.mt-b:focus-visible,.mt-cd:focus-visible,.pr-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.qz-opt .mk{margin-left:auto;font-size:2rem;font-style:normal}

@keyframes qzshake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.qz-exp{display:none;margin-top:18px;padding:16px 18px;border-radius:20px;font-size:1.5rem;word-break:keep-all}

.mt-board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;position:relative;left:50%;transform:translateX(-50%);width:min(calc(100vw - 48px),max(300px,calc((100vh - 430px) * 4.7 / var(--rows,2))));width:min(calc(100vw - 48px),max(300px,calc((100dvh - 430px) * 4.7 / var(--rows,2))))}
.mt-cd{aspect-ratio:1.2;perspective:900px;container-type:inline-size;padding:0;border:0;background:none;cursor:pointer;font:inherit;color:inherit;display:block}

.mt-cd.up .mt-in{transform:rotateY(180deg)}
.mt-fc{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:4px solid var(--ink);border-radius:7cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}

@keyframes mthop{40%{transform:scale(1.07)}}
@media (prefers-reduced-motion:reduce){.mt-in{transition:none}.mt-cd.done{animation:none}}

  function initStory(panel){
    var svg=panel.querySelector("svg");
    var NS="http://www.w3.org/2000/svg";
    var VW=800,VH=490;
    var layer=document.createElementNS(NS,"g");
    svg.appendChild(layer);

    Array.prototype.forEach.call(svg.querySelectorAll(".tag"),function(t){
      var f=svg.querySelector('.drag[data-name="'+t.getAttribute("data-for")+'"]');
      if(f)f.appendChild(t);
    });

    var items=Array.prototype.slice.call(svg.querySelectorAll(".drag"));
    items.forEach(function(g){g._x=0;g._y=0;layer.appendChild(g);});

    var cur=null;
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}

      var m=svg.getScreenCTM();

    }

    svg.addEventListener("pointerdown",function(e){
      if(cur)return;
      if(e.pointerType==="mouse"&&e.button!==0)return;
      var g=e.target.closest&&e.target.closest(".drag");
      if(!g)return;
      var p=toSvg(e);

      var b=boxOf(g);

        minx:-b.x,maxx:VW-(b.x+b.width),miny:-b.y,maxy:VH-(b.y+b.height)};
      g.classList.remove("returning","falling");
      layer.appendChild(g);
      g.classList.add("dragging");
      try{svg.setPointerCapture(e.pointerId);}catch(_){}
      e.preventDefault();
    });

    svg.addEventListener("pointermove",function(e){
      if(!cur||e.pointerId!==cur.id)return;
      var p=toSvg(e);
      if(!p)return;
      setPos(cur.g,
        clamp(cur.x0+p.x-cur.sx,cur.minx,cur.maxx),
        clamp(cur.y0+p.y-cur.sy,cur.miny,cur.maxy));

      if(!cur||e.pointerId!==cur.id)return;

    });
    svg.addEventListener("pointercancel",end);
    svg.addEventListener("lostpointercapture",end);

    var gol=svg.querySelector('.drag[data-name="골리앗"]');
    var dav=svg.querySelector('.drag[data-name="다윗"]');
    var fallBtn=panel.querySelector(".fall-btn");
    var fallen=false,token=0,lastTap=0;

    function boxOf(g){
      var b=g.getBBox();
      if(g._r===-90){
        return {x:558+(b.y-432),y:432-(b.x+b.width-558),width:b.height,height:b.width};
      }
      return b;
    }
    function fall(){
      if(cur||fallen)return;
      fallen=true;
      fallBtn.disabled=true;
      var t=++token;
      svg.classList.add("fired");
      var s0={x:281+dav._x,y:333+dav._y};
      var s1={x:590+gol._x,y:112+gol._y};
      var stone=document.createElementNS(NS,"circle");
      stone.setAttribute("class","flystone");
      stone.setAttribute("r","7");
      stone.setAttribute("fill","#B7B2A6");
      stone.setAttribute("stroke","#9A9488");
      stone.setAttribute("stroke-width","2");
      svg.appendChild(stone);
      var t0=null;
      function step(ts){
        if(t!==token){stone.remove();return;}
        if(t0===null)t0=ts;
        var k=Math.min(1,(ts-t0)/650);
        stone.setAttribute("cx",s0.x+(s1.x-s0.x)*k);
        stone.setAttribute("cy",s0.y+(s1.y-s0.y)*k-Math.sin(Math.PI*k)*70);

    function topple(t){
      if(t!==token)return;

      var tx=clamp(gol._x+90,-b.x,VW-(b.x+b.width));

      gol.classList.add("falling");
      svg.classList.add("is-fallen");
      setPos(gol,tx,ty,-90);
      setTimeout(function(){
        if(t!==token)return;
        gol.classList.remove("falling");
        var th=document.createElementNS(NS,"text");
        th.setAttribute("class","thud");
        th.setAttribute("x",String(258+tx));
        th.setAttribute("y",String(330+ty));

        svg.appendChild(th);
        setTimeout(function(){th.remove();},1300);
      },950);
    }
    function resetFall(){
      token++;
      fallen=false;
      fallBtn.disabled=false;
      gol.classList.remove("falling");
      svg.classList.remove("fired","is-fallen");
      Array.prototype.forEach.call(svg.querySelectorAll(".thud,.flystone"),function(n){n.remove();});
    }
    fallBtn.addEventListener("click",fall);

    svg.addEventListener("touchmove",function(e){
      if(cur&&e.cancelable)e.preventDefault();
    },{passive:false});

    panel.querySelector(".reset-btn").addEventListener("click",function(){
      if(cur)return;

        g.classList.add("returning");
        setPos(g,0,0,0);
      });
      setTimeout(function(){
        items.forEach(function(g){g.classList.remove("returning");});
      },450);
    });
  }

  function initThink(panel){

    var ov=panel.querySelector(".q-full");
    var cnt=ov.querySelector(".qf-count");
    var txt=ov.querySelector(".qf-text");

    var next=ov.querySelector(".qf-next");
    var close=ov.querySelector(".qf-close");
    var n=cards.length,idx=0,opener=null,sx=null;

    function show(i){
      idx=(i+n)%n;
      ov.className="q-full c"+(idx+1);
      cnt.textContent="질문 "+(idx+1)+" / "+n;
      txt.textContent=cards[idx].querySelector(".q-text").textContent;
    }
    function onKey(e){
      if(e.key==="Escape"){e.preventDefault();shut();}
      else if(e.key==="ArrowRight"){show(idx+1);}
      else if(e.key==="ArrowLeft"){show(idx-1);}
      else if(e.key==="Tab"){
        var f=[prev,close,next],k=f.indexOf(document.activeElement);
        if(e.shiftKey){if(k<=0){e.preventDefault();f[f.length-1].focus();}}
        else if(k<0||k===f.length-1){e.preventDefault();f[0].focus();}
      }
    }
    function open(i){
      opener=cards[i];
      show(i);
      ov.hidden=false;
      document.body.style.overflow="hidden";
      document.addEventListener("keydown",onKey);
      close.focus();
    }
    function shut(){
      ov.hidden=true;
      document.body.style.overflow="";
      document.removeEventListener("keydown",onKey);
      if(opener)opener.focus();
    }

    cards.forEach(function(c,i){c.addEventListener("click",function(){open(i);});});
    prev.addEventListener("click",function(){show(idx-1);});
    next.addEventListener("click",function(){show(idx+1);});
    close.addEventListener("click",shut);

    ov.addEventListener("pointerdown",function(e){
      if(e.target.closest("button"))return;
      sx=e.clientX;
    });
    ov.addEventListener("pointerup",function(e){
      if(sx===null)return;
      var dx=e.clientX-sx;
      sx=null;
      if(Math.abs(dx)>60)show(idx+(dx<0?1:-1));
    });
    ov.addEventListener("pointercancel",function(){sx=null;});
  }

    if(!cfCv){
      cfCv=document.createElement("canvas");cfCv.className="fx-canvas";cfCv.setAttribute("aria-hidden","true");

        w:(6+Math.random()*8)*(s||1),h:(10+Math.random()*10)*(s||1),r:Math.random()*6,vr:(Math.random()-.5)*.4,
        c:CF_COL[Math.floor(Math.random()*CF_COL.length)],life:110+Math.random()*60});
    }

  }
  function cfTick(){
    cfCx.clearRect(0,0,cfCv.width,cfCv.height);
    cfP=cfP.filter(function(q){return q.life>0&&q.y<cfCv.height+30;});
    cfP.forEach(function(q){
      q.vy+=.35;q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.r+=q.vr;q.life--;
      cfCx.save();cfCx.translate(q.x,q.y);cfCx.rotate(q.r);
      cfCx.globalAlpha=Math.min(1,q.life/30);cfCx.fillStyle=q.c;
      cfCx.fillRect(-q.w/2,-q.h/2,q.w,q.h);cfCx.restore();
    });
    if(cfP.length)requestAnimationFrame(cfTick);
    else{cfRun=false;cfCx.clearRect(0,0,cfCv.width,cfCv.height);}
  }

  function makeRoster(){
    var KEY="class-roster-v1",MAXN=30,MAXLEN=10,MAXCLS=12;
    var DEF=["다람쥐","사슴","참새","고래","나비"];
    var known={"다람쥐":"🐿️","사슴":"🦌","참새":"🐦","고래":"🐳","나비":"🦋"};
    var pool=["🐻","🐰","🦊","🐼","🐸","🐢","🐧","🦉","🐝","🐞","🐬","🦁","🐯","🐨","🐶","🐱","🦄","🐙","🦒","🐘","🐷","🐮","🐵","🐹","🦔","🐠","🦀","🐛","🦆","🐴"];
    var names=[],emo={},cls="햇살반",subs=[];
    function has(o,k){return Object.prototype.hasOwnProperty.call(o,k);}
    function norm(s){return String(s==null?"":s).replace(/\s+/g," ").trim();}
    function len(s){return Array.from(s).length;}
    function usedSet(except){
      var u={};
      Object.keys(emo).forEach(function(k){if(k!==except)u[emo[k]]=true;});
      return u;
    }
    function pick(n){
      var u=usedSet(n),i,k,c,h=0;
      if(has(known,n)&&!u[known[n]])return known[n];
      for(i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
      for(k=0;k<pool.length;k++){
        c=pool[(h+k)%pool.length];
        if(!u[c])return c;
      }
      return "⭐";
    }
    function valid(n){
      return typeof n==="string"&&n===norm(n)&&n!==""&&len(n)<=MAXLEN&&n!=="__proto__";
    }
    (function load(){
      var s=null;
      try{s=JSON.parse(localStorage.getItem(KEY)||"null");}catch(_){s=null;}
      var list=null;
      if(s&&Array.isArray(s.names)){
        list=[];
        s.names.forEach(function(n){if(valid(n)&&list.indexOf(n)<0&&list.length<MAXN)list.push(n);});
      }
      if(!list)list=DEF.slice();
      list.forEach(function(n){
        names.push(n);
        var e=s&&s.emo&&has(s.emo,n)?s.emo[n]:null;
        emo[n]=(typeof e==="string"&&e&&len(e)<=4)?e:pick(n);
      });
      if(s&&typeof s.cls==="string"){
        var c=norm(s.cls);
        if(c&&len(c)<=MAXCLS)cls=c;
      }
    })();
    function save(){
      try{localStorage.setItem(KEY,JSON.stringify({cls:cls,names:names,emo:emo}));}catch(_){}
    }
    function emit(e){
      save();
      subs.slice().forEach(function(f){try{f(e);}catch(_){}});
    }
    function check(n,except){
      if(!n)return "이름을 써 주세요.";
      if(len(n)>MAXLEN)return "이름은 "+MAXLEN+"글자까지 쓸 수 있어요.";
      if(n==="__proto__")return "쓸 수 없는 이름이에요.";
      if(n!==except&&names.indexOf(n)>=0)return "이미 있는 이름이에요.";
      return "";
    }
    return {
      names:names,emo:emo,MAXN:MAXN,MAXLEN:MAXLEN,MAXCLS:MAXCLS,norm:norm,check:check,
      cls:function(){return cls;},
      on:function(f){subs.push(f);},
      add:function(raw){
        var n=norm(raw),err=check(n,null);
        if(err)return err;
        if(names.length>=MAXN)return "명단은 "+MAXN+"명까지예요.";
        names.push(n);emo[n]=pick(n);
        emit({type:"add",name:n});
        return "";
      },
      remove:function(n){
        var i=names.indexOf(n);
        if(i<0)return;
        names.splice(i,1);delete emo[n];
        emit({type:"remove",name:n});
      },
      rename:function(from,raw){
        var to=norm(raw),i=names.indexOf(from);
        if(i<0)return "없는 이름이에요.";
        if(to===from)return "";
        var err=check(to,from);
        if(err)return err;
        names[i]=to;emo[to]=emo[from];delete emo[from];
        emit({type:"rename",from:from,to:to});
        return "";
      },
      restore:function(rawCls,list){
        if(!Array.isArray(list)||!list.length)return "명단이 비어 있어요.";
        if(list.length>MAXN)return "명단이 너무 길어요.";
        var seen={},clean=[],i,n;
        for(i=0;i<list.length;i++){
          n=list[i];
          if(!valid(n)||has(seen,n))return "기록에 쓸 수 없는 이름이 들어 있어요.";
          seen[n]=true;clean.push(n);
        }
        var old=names.slice(),c=norm(rawCls);
        Object.keys(emo).forEach(function(k){if(!has(seen,k))delete emo[k];});
        clean.forEach(function(k){if(!has(emo,k))emo[k]=pick(k);});
        names.length=0;
        clean.forEach(function(k){names.push(k);});
        if(c&&len(c)<=MAXCLS)cls=c;
        emit({type:"replace",old:old});
        return "";
      },
      setCls:function(raw){
        var c=norm(raw);
        if(!c||len(c)>MAXCLS||c===cls)return;
        cls=c;emit({type:"cls"});
      }
    };
  }

      save();
      render();
      toast(n+" "+(applied>0?"+":"−")+Math.abs(applied)+" 달란트");
    }

    function render(){
      var total=0,max=0;
      roster.forEach(function(n){
        var c=counts[n],r=rows[n];
        total+=c;
        if(c>max)max=c;
        var bigs=Math.floor(c/10),sm=c%10;
        var showB=Math.min(bigs,MAXICONS);
        var showS=Math.min(sm,MAXICONS-showB);
        var hidden=c-(showB*10+showS);
        r.pile.textContent="";
        var k;
        for(k=0;k<showB;k++)r.pile.appendChild(medal(true));
        for(k=0;k<showS;k++)r.pile.appendChild(medal(false));
        if(hidden>0){
          var more=document.createElement("span");
          more.className="tal-more";
          more.textContent="+"+hidden;
          r.pile.appendChild(more);
        }
        var cnt=document.createElement("span");
        cnt.className="tal-count";
        cnt.textContent=c+"개";
        r.pile.appendChild(cnt);
        r.li.setAttribute("aria-label",n+" 달란트 "+c+"개");
        r.minus.setAttribute("aria-disabled",c===0?"true":"false");
      });
      totalEl.textContent=total+"개";
      bestEl.textContent=max===0?"아직 없어요":
        roster.filter(function(n){return counts[n]===max;})
          .map(function(n){return emo[n]+" "+n;}).join(", ")+" ("+max+"개)";
      if(typeof refreshOut==="function")refreshOut();
    }

    var resetBtn=panel.querySelector(".att-reset");
    var resetTimer=null;
    function disarm(){
      clearTimeout(resetTimer);
      resetTimer=null;
      resetBtn.classList.remove("confirm");
      resetBtn.textContent="달란트 처음부터";
    }
    resetBtn.addEventListener("click",function(){
      if(!resetTimer){
        resetBtn.classList.add("confirm");
        resetBtn.textContent="정말 지울까요?";
        resetTimer=setTimeout(disarm,5000);
        return;
      }
      disarm();
      roster.forEach(function(n){counts[n]=0;});
      save();
      render();
      toast("달란트를 모두 지웠어요");
    });

    var TAG='{"app":"sunday-class"';
    var bkOpen=panel.querySelector(".tal-bk-open");
    var bk=panel.querySelector(".tal-bk");
    var outTa=panel.querySelector(".tal-bk-out");
    var inTa=panel.querySelector(".tal-bk-in");
    var copyBtn=panel.querySelector(".tal-bk-copy");
    var restoreBtn=panel.querySelector(".tal-bk-restore");
    var outMsg=panel.querySelector(".tal-bk-msg.out");
    var inMsg=panel.querySelector(".tal-bk-msg.in");
    var pending=null,pendTimer=null;

    function attOf(n){return Bridge.att?Bridge.att.get(n):0;}
    function buildBackup(){
      var d=new Date();
      var iso=d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
      var lines=["[우리 반 기록] 초등 3부 "+Roster.cls()];
      roster.forEach(function(n){
        lines.push("· "+n+" — 출석 "+attOf(n)+"번, 달란트 "+counts[n]+"개");
      });
      var data={app:"sunday-class",v:1,cls:Roster.cls(),d:iso,rows:roster.map(function(n){
        return {n:n,a:attOf(n),t:counts[n]};
      })};
      lines.push("");
      lines.push("[되살리기용 한 줄 — 고치지 마세요]");
      lines.push(JSON.stringify(data));
      return lines.join("\n");
    }
    function refreshOut(){if(!bk.hidden)outTa.value=buildBackup();}
    function selectAll(ta){
      try{ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);}catch(_){}
    }
    function setOut(t){outMsg.textContent=t;}
    function setIn(t){inMsg.textContent=t;}
    function disarmRestore(){
      clearTimeout(pendTimer);pendTimer=null;pending=null;
      restoreBtn.classList.remove("confirm");
      restoreBtn.textContent="이 기록 다시 불러오기";
    }

    bkOpen.addEventListener("click",function(){
      if(bk.hidden){
        bk.hidden=false;
        outTa.value=buildBackup();
        bkOpen.textContent="학기 기록 닫기";
        setOut("");setIn("");
      }else{
        bk.hidden=true;
        disarmRestore();
        bkOpen.textContent="학기 기록 꺼내기";
      }
    });
    outTa.addEventListener("click",function(){selectAll(outTa);});
    outTa.addEventListener("focus",function(){selectAll(outTa);});
    copyBtn.addEventListener("click",function(){
      var text=outTa.value,done=false;
      function fallback(){
        selectAll(outTa);
        try{done=document.execCommand&&document.execCommand("copy");}catch(_){done=false;}
        setOut(done?"복사했어요.":"복사가 안 돼요. 상자 안을 눌러 전체를 고른 뒤 직접 복사해 주세요.");
      }
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(function(){setOut("복사했어요.");},fallback);
        }else fallback();
      }catch(_){fallback();}
    });

    function scan(text,start){
      var depth=0,inStr=false,esc=false,i,c;
      for(i=start;i<text.length;i++){
        c=text.charAt(i);
        if(inStr){
          if(esc)esc=false;
          else if(c==="\\")esc=true;
          else if(c==='"')inStr=false;
        }else if(c==='"')inStr=true;
        else if(c==="{")depth++;
        else if(c==="}"){depth--;if(depth===0)return i;}
      }
      return -1;
    }
    function findBackup(text){
      var k=text.indexOf(TAG),end,o;
      while(k>=0){
        end=scan(text,k);
        if(end>0){
          try{
            o=JSON.parse(text.slice(k,end+1));
            if(o&&o.app==="sunday-class"&&o.v===1&&Array.isArray(o.rows))return o;
          }catch(_){}
        }
        k=text.indexOf(TAG,k+1);
      }
      return null;
    }
    function num(v,max){
      v=Number(v);
      return (isFinite(v)&&v>0)?Math.min(max,Math.floor(v)):0;
    }

    inTa.addEventListener("input",function(){disarmRestore();setIn("");});
    restoreBtn.addEventListener("click",function(){
      if(!pending){
        var o=findBackup(inTa.value);
        if(!o){setIn("붙여넣은 글에서 기록 한 줄을 찾지 못했어요. 꺼낸 글 전체를 그대로 붙여넣어 주세요.");return;}
        var names=[];
        o.rows.forEach(function(r){names.push(r&&r.n);});
        if(!names.length){setIn("기록에 아이 이름이 없어요.");return;}
        var bad=names.some(function(n,i){return Roster.check(n,n)!==""||Roster.norm(n)!==n||names.indexOf(n)!==i;});
        if(bad||names.length>Roster.MAXN){setIn("기록에 쓸 수 없는 이름이 들어 있어요.");return;}
        pending=o;
        restoreBtn.classList.add("confirm");
        restoreBtn.textContent="정말 불러올까요?";
        setIn(names[0]+(names.length>1?" 외 "+(names.length-1)+"명":"")+"의 기록을 찾았어요. 지금 기록은 모두 이 기록으로 바뀌어요. 한 번 더 누르면 불러옵니다.");
        pendTimer=setTimeout(function(){disarmRestore();setIn("");},8000);
        return;
      }
      var data=pending;
      disarmRestore();
      var list=data.rows.map(function(r){return r.n;});
      var err=Roster.restore(typeof data.cls==="string"?data.cls:Roster.cls(),list);
      if(err){setIn(err);return;}
      var a={},t={};
      data.rows.forEach(function(r){a[r.n]=num(r.a,99999);t[r.n]=num(r.t,MAXV);});
      if(Bridge.att)Bridge.att.restore(a);
      Bridge.tal.restore(t);
      inTa.value="";
      setIn("불러왔어요.");
      toast("기록을 불러왔어요");
    });

    Bridge.tal={
      restore:function(map){
        roster.forEach(function(n){counts[n]=num(map&&map[n],MAXV);});
        save();render();
      }
    };

    Roster.on(function(e){
      if(e.type==="add")counts[e.name]=0;
      else if(e.type==="remove")delete counts[e.name];
      else if(e.type==="rename"){counts[e.to]=counts[e.from]||0;delete counts[e.from];}
      else if(e.type==="replace"){
        e.old.forEach(function(n){if(roster.indexOf(n)<0)delete counts[n];});
        roster.forEach(function(n){if(!Object.prototype.hasOwnProperty.call(counts,n))counts[n]=0;});
      }
      else return;
      save();buildRows();render();
    });

    render();
  }

  function initAttendance(panel){
    var SR=sharedRoster(),roster=SR.roster,emo=SR.emo;

    var V1="attendance-counts-v1",V2="attendance-v2";
    var SB_URL="https://bhpwybecwshgugoireho.supabase.co";
    var SB_KEY="sb_publishable_SOtNeNvIQfcxk9suANdJpQ_sjSWIxzb";
    var counts={},T=0,dirty={};
    function clean(src){
      var out={};
      roster.forEach(function(n){
        var v=src&&src[n];
        out[n]=(typeof v==="number"&&isFinite(v)&&v>0)?Math.floor(v):0;
      });
      return out;
    }
    (function(){
      var s=null;
      try{s=JSON.parse(localStorage.getItem(V2)||"null");}catch(_){s=null;}
      if(s&&s.counts&&typeof s.t==="number"){
        counts=clean(s.counts);T=s.t;
        if(Array.isArray(s.dirty))s.dirty.forEach(function(n){if(typeof n==="string"&&n&&n.length<=40)dirty[n]=true;});
        return;
      }
      try{
        var old=JSON.parse(localStorage.getItem(V1)||"null");
        if(old&&typeof old==="object"){counts=clean(old);T=1;return;}
      }catch(_){}
      counts=clean(null);
    })();
    function saveLocal(){
      try{localStorage.setItem(V2,JSON.stringify({t:T,counts:counts,dirty:Object.keys(dirty)}));}catch(_){}
    }

    panel.classList.add("attend");
    panel.innerHTML=
      '<p class="att-offline" role="status" hidden>기기에만 저장 중</p>'+
      '<div class="att-sum">'+
        '<div class="att-box"><p class="att-label">우리 반 누적 출석</p><p class="att-big att-total"></p></div>'+
        '<div class="att-box"><p class="att-label">가장 많이 온 친구</p><p class="att-big att-best"></p></div>'+
      '</div>'+
      '<ul class="att-list"></ul>'+
      '<button type="button" class="att-all">오늘 모두 ＋1</button>'+
      '<button type="button" class="att-reset">출석 처음부터</button>';

    var list=panel.querySelector(".att-list");
    var totalEl=panel.querySelector(".att-total");
    var bestEl=panel.querySelector(".att-best");
    var rows={};
    function buildRows(){
    list.textContent="";rows={};
    roster.forEach(function(n,i){
      var li=document.createElement("li");
      li.className="att-row c"+(i%4+1);
      var top=document.createElement("div");
      top.className="att-top";
      var nm=document.createElement("p");
      nm.className="att-name";
      nm.textContent=emo[n]+" "+n;
      var minus=document.createElement("button");
      minus.type="button";minus.className="att-btn";
      minus.textContent="−";
      minus.setAttribute("aria-label",n+" 출석 빼기");
      var plus=document.createElement("button");
      plus.type="button";plus.className="att-btn";
      plus.textContent="＋";
      plus.setAttribute("aria-label",n+" 출석 더하기");
      top.appendChild(nm);top.appendChild(minus);top.appendChild(plus);
      var lv=document.createElement("div");
      lv.className="att-leaves";
      var leaves=document.createElement("span");
      leaves.setAttribute("aria-hidden","true");
      var cnt=document.createElement("span");
      cnt.className="att-count";
      cnt.setAttribute("aria-live","polite");
      lv.appendChild(leaves);lv.appendChild(cnt);
      li.appendChild(top);li.appendChild(lv);
      list.appendChild(li);
      rows[n]={leaves:leaves,cnt:cnt,minus:minus};
      plus.addEventListener("click",function(){counts[n]+=1;change([n]);});
      minus.addEventListener("click",function(){
        if(counts[n]>0){counts[n]-=1;change([n]);}
      });
    });
    }
    buildRows();

    function render(){
      var total=0,max=0;
      roster.forEach(function(n){
        var c=counts[n],r=rows[n];
        total+=c;
        if(c>max)max=c;
        r.leaves.textContent=c>0?new Array(c+1).join("🌿"):"";
        r.cnt.textContent=c+"번";
        r.minus.setAttribute("aria-disabled",c===0?"true":"false");
      });
      totalEl.textContent=total+"번";
      bestEl.textContent=max===0?"아직 없어요":
        roster.filter(function(n){return counts[n]===max;})
          .map(function(n){return emo[n]+" "+n;}).join(", ")+" ("+max+"번)";
    }

    panel.querySelector(".att-all").addEventListener("click",function(){
      roster.forEach(function(n){counts[n]+=1;});
      change(roster);
    });

    var resetBtn=panel.querySelector(".att-reset");
    var resetTimer=null;
    function disarm(){
      clearTimeout(resetTimer);
      resetTimer=null;
      resetBtn.classList.remove("confirm");
      resetBtn.textContent="출석 처음부터";
    }
    resetBtn.addEventListener("click",function(){
      if(!resetTimer){
        resetBtn.classList.add("confirm");
        resetBtn.textContent="정말 지울까요?";
        resetTimer=setTimeout(disarm,5000);
        return;
      }
      disarm();
      roster.forEach(function(n){counts[n]=0;});
      try{localStorage.removeItem(V1);}catch(_){}
      change(roster);
    });

    var offEl=panel.querySelector(".att-offline");
    var busy=false,again=false,syncing=false,ver=0,lastSync=0,retryTimer=null,retryMs=15000;

    function setOnline(ok){
      offEl.hidden=ok;
      if(ok){
        retryMs=15000;
        if(retryTimer){clearTimeout(retryTimer);retryTimer=null;}
      }
    }
    function scheduleRetry(){
      if(retryTimer)return;
      retryTimer=setTimeout(function(){retryTimer=null;sync(true);},retryMs);
      retryMs=Math.min(retryMs*2,120000);
    }
    function sb(path,opt){
      opt=opt||{};
      try{
        var ctl=typeof AbortController!=="undefined"?new AbortController():null;
        var timer=setTimeout(function(){if(ctl)ctl.abort();},8000);
        var h={apikey:SB_KEY};
        if(opt.body)h["Content-Type"]="application/json";
        if(opt.prefer)h.Prefer=opt.prefer;
        return fetch(SB_URL+"/rest/v1/"+path,{
          method:opt.method||"GET",headers:h,body:opt.body,signal:ctl?ctl.signal:undefined
        }).then(function(r){
          clearTimeout(timer);
          if(!r.ok)throw new Error("http "+r.status);
          return r.text().then(function(t){return t?JSON.parse(t):null;});
        },function(e){clearTimeout(timer);throw e;});
      }catch(e){return Promise.reject(e);}
    }

    function flush(){
      var names=Object.keys(dirty);
      if(!names.length)return Promise.resolve();
      if(busy){again=true;return Promise.resolve();}
      busy=true;
      var snap={};
      var body=names.map(function(n){var v=roster.indexOf(n)>=0?counts[n]:0;snap[n]=v;return {nickname:n,visits:v};});
      return sb("attendance?on_conflict=nickname",{
        method:"POST",prefer:"resolution=merge-duplicates,return=minimal",body:JSON.stringify(body)
      }).then(function(){
        busy=false;
        names.forEach(function(n){var cur=roster.indexOf(n)>=0?counts[n]:0;if(cur===snap[n])delete dirty[n];});
        saveLocal();
        setOnline(true);
        if(again||Object.keys(dirty).length){again=false;return flush();}
      },function(){
        busy=false;again=false;
        setOnline(false);
        scheduleRetry();
      }).catch(function(){busy=false;});
    }

    function sync(force){
      if(syncing)return;
      if(!force&&Date.now()-lastSync<4000)return;
      syncing=true;lastSync=Date.now();
      var v0=ver;
      sb("attendance?select=nickname,visits").then(function(rows){
        var remote={};
        (Array.isArray(rows)?rows:[]).forEach(function(r){
          if(r&&typeof r.nickname==="string")remote[r.nickname]=r.visits;
        });
        if(ver===v0){
          roster.forEach(function(n){
            if(dirty[n])return;
            if(Object.prototype.hasOwnProperty.call(remote,n)){
              var v=Number(remote[n]);
              counts[n]=(isFinite(v)&&v>0)?Math.floor(v):0;
            }else{
              dirty[n]=true;
            }
          });
          saveLocal();render();
        }else{
          setTimeout(function(){sync(true);},1000);
        }
        setOnline(true);
        syncing=false;
        return flush();
      }).catch(function(){
        syncing=false;
        setOnline(false);
        scheduleRetry();
      });
    }

    function change(list){
      ver++;T=Date.now();
      list.forEach(function(n){dirty[n]=true;});
      saveLocal();render();
      flush();
    }

    window.addEventListener("online",function(){sync(true);});
    window.addEventListener("offline",function(){setOnline(false);scheduleRetry();});
    document.addEventListener("visibilitychange",function(){if(!document.hidden)sync();});
    if(typeof MutationObserver!=="undefined"){
      new MutationObserver(function(){if(!panel.hidden)sync();})
        .observe(panel,{attributes:true,attributeFilter:["hidden"]});
    }

    Roster.on(function(e){
      if(e.type==="add"){counts[e.name]=0;dirty[e.name]=true;}
      else if(e.type==="remove"){delete counts[e.name];dirty[e.name]=true;}
      else if(e.type==="rename"){counts[e.to]=counts[e.from]||0;delete counts[e.from];dirty[e.to]=true;dirty[e.from]=true;}
      else if(e.type==="replace"){
        e.old.forEach(function(n){if(roster.indexOf(n)<0){delete counts[n];dirty[n]=true;}});
        roster.forEach(function(n){if(!Object.prototype.hasOwnProperty.call(counts,n)){counts[n]=0;dirty[n]=true;}});
      }
      else return;
      ver++;T=Date.now();saveLocal();buildRows();render();flush();
    });
    Bridge.att={
      get:function(n){return counts[n]||0;},
      restore:function(map){
        roster.forEach(function(n){
          var v=Number(map&&map[n]);
          counts[n]=(isFinite(v)&&v>0)?Math.min(99999,Math.floor(v)):0;
          dirty[n]=true;
        });
        ver++;T=Date.now();saveLocal();render();flush();
      }
    };

    render();
    sync(true);
  }

  function select(k,focus){
    names.forEach(function(_,i){
      var t=document.getElementById("tab-"+i);
      t.setAttribute("aria-selected",i===k?"true":"false");
      t.tabIndex=i===k?0:-1;
      document.getElementById("panel-"+i).hidden=i!==k;
    });
    if(focus)document.getElementById("tab-"+k).focus();
  }
})();
</script>
